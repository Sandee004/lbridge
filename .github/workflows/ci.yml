name: CI Pipeline & Eval Regression Gate

on:
  push:
    branches: [ main, steep ]
  pull_request:
    branches: [ main, steep ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Test Suite
        working-directory: backend
        run: pytest -v

      - name: Run Config E Eval Regression Gate
        run: |
          python -m eval.run --config eval/configs/E.yaml --dataset eval/data/dev.jsonl

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint
